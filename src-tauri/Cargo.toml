[package]
name = "virtual-midi-player"
version = "1.0.1"
edition = "2021"
description = "MIDI auto-player for in-game pianos (Roblox, Garry's Mod)"
default-run = "virtual-midi-player"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
midly = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5" }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_System_Threading", "Win32_Globalization"] }
dirs = "5.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
